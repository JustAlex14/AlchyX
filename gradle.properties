org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment (same as AlchyMastery)
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
# 26.1.2.106 = the NeoForge ATM11 ships. Not .114: KubeJS 8.0.6 (built on .84) crashes on world load with .114,
# whose WorldLoader calls a newer RegistryDataLoader.load overload that KubeJS's WorldLoaderMixin can't find.
neo_version=26.1.2.106
neo_version_range=[26,)
loader_version_range=[4,)

## Mod
mod_id=alchyx
mod_name=AlchyX
mod_license=MIT
# Bump when the API changes; AlchyMastery asks for this version (alchyx_version in its gradle.properties)
mod_version=0.3.0
mod_group_id=com.lealex
mod_authors=Alex
mod_description=Data-driven multiblock machines: structure detection, forming, disguised shells and animations defined in datapack files.

## Optional integrations
# KubeJS for Minecraft 26.1 (Modrinth version numbers: https://modrinth.com/mod/kubejs/versions) and its required mods
kubejs_version=26.1.2-8.0.6+neoforge
rhino_version=2101.2.8-build.91+Rhino-1.21
bat_version=2601.1.0-build.9
jei_version=29.43.0.106
jei_minecraft_version=26.1.2
patchouli_version=26.1-94

# Jade (https://modrinth.com/mod/jade/versions)
jade_version=26.1.11+neoforge
