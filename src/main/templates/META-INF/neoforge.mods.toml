modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/JustAlex14/AlchyX/issues"

[[mods]]
modId="${mod_id}"
logoFile="alchyx.png"
displayURL="https://github.com/JustAlex14/AlchyX"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# The furnace hook that keeps a rifted thing rifted when it is cooked (mixin/FurnaceRiftMixin, optional injections).
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
